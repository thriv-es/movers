# =============================================================================
# Wrangler configuration for the backend Cloudflare Worker
#
# GETTING STARTED
# ---------------
# 1. Rename this worker: change `name` below to match your project.
# 2. For local dev, run: pnpm dev  (no Cloudflare account required)
# 3. For production, create each resource with the Cloudflare CLI, then paste
#    the IDs into the [env.production] section at the bottom of this file.
#
# PLACEHOLDER IDs
# ---------------
# The placeholder IDs below (all zeros) are used by `wrangler dev` to spin up
# local simulations of each service — no real Cloudflare resources are created.
# Replace them only when deploying to production.
# =============================================================================

name = "my-worker"          # ← Rename to match your project (used as the Worker's subdomain)
main = "src/index.ts"
compatibility_date = "2025-05-01"

# ---------------------------------------------------------------------------
# Environment variables available in code via `c.env.ENV`
# ---------------------------------------------------------------------------
[vars]
ENV = "development"

# ---------------------------------------------------------------------------
# Cloudflare D1 — SQLite database
# Create for production: wrangler d1 create my-worker-database
# Docs: https://developers.cloudflare.com/d1/
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"                              # Access in worker code as: c.env.DB
database_name = "my-worker-database-local"  # Local simulation name (can be anything)
database_id = "00000000-0000-0000-0000-000000000001"  # Placeholder — safe for local dev

# ---------------------------------------------------------------------------
# Cloudflare KV — key-value store
# Create for production: wrangler kv namespace create my-worker-cache
# Docs: https://developers.cloudflare.com/kv/
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"                              # Access in worker code as: c.env.KV
id = "00000000000000000000000000000001"     # Placeholder — safe for local dev

# ---------------------------------------------------------------------------
# Cloudflare R2 — object / blob storage
# Create for production: wrangler r2 bucket create my-worker-storage
# Docs: https://developers.cloudflare.com/r2/
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "BUCKET"                          # Access in worker code as: c.env.BUCKET
bucket_name = "my-worker-storage-local"    # Local simulation bucket name

# ---------------------------------------------------------------------------
# Cloudflare Queues — durable background task queue
# Create for production: wrangler queues create my-worker-tasks
# Docs: https://developers.cloudflare.com/queues/
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "QUEUE"                           # Access in worker code as: c.env.QUEUE
queue = "my-worker-tasks-local"            # Local simulation queue name

# =============================================================================
# PRODUCTION ENVIRONMENT
# =============================================================================
# Uncomment and fill in after creating resources in the Cloudflare dashboard.
# Deploy with: wrangler deploy --env production
# =============================================================================
[env.production]
vars = { ENV = "production" }
logpush = true
analytics_engine_datasets = [{ binding = "ANALYTICS" }]


# =============================================================================
# Wrangler configuration for the Movers backend Cloudflare Worker
#
# GETTING STARTED
# ---------------
# 1. For local dev: copy .dev.vars.example to .dev.vars and fill in secrets
# 2. Run: pnpm dev  (no Cloudflare account required)
# 3. For production, create each resource with the Cloudflare CLI, then paste
#    the IDs into the [env.production] section at the bottom of this file.
#
# PLACEHOLDER IDs
# ---------------
# The placeholder IDs below (all zeros) are used by `wrangler dev` to spin up
# local simulations of each service -no real Cloudflare resources are created.
# Replace them only when deploying to production.
# =============================================================================

name = "movers"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# ---------------------------------------------------------------------------
# Workers Logs
# ---------------------------------------------------------------------------
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# ---------------------------------------------------------------------------
# Environment variables
# Secrets (AI_GATEWAY_AUTH_TOKEN) go in .dev.vars for local dev.
# For production: `wrangler secret put AI_GATEWAY_AUTH_TOKEN`
# ---------------------------------------------------------------------------
[vars]
ENV = "development"
AI_GATEWAY_PROJECT_NAME = "movers_demo"
PRICE_PER_BOX = 50
PRICE_PER_LARGE_ITEM = 100

# ---------------------------------------------------------------------------
# Cloudflare R2 -object / blob storage for uploaded move photos
# Create for production: wrangler r2 bucket create movers-storage
# Docs: https://developers.cloudflare.com/r2/
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "MOVERS_BUCKET"                  # Access in worker code as: c.env.MOVERS_BUCKET
bucket_name = "movers-dev"                 # Local simulation bucket name

# ---------------------------------------------------------------------------
# Cloudflare D1 -SQLite database (uncomment if needed)
# Create for production: wrangler d1 create movers-database
# ---------------------------------------------------------------------------
# [[d1_databases]]
# binding = "DB"
# database_name = "movers-database-local"
# database_id = "00000000-0000-0000-0000-000000000001"  # Placeholder

# ---------------------------------------------------------------------------
# Cloudflare KV -key-value store (uncomment if needed)
# Create for production: wrangler kv namespace create movers-cache
# ---------------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "KV"
# id = "00000000000000000000000000000001"  # Placeholder

# =============================================================================
# PREVIEW ENVIRONMENT
# =============================================================================
[env.preview]
vars = { ENV = "preview" }
logpush = true

# =============================================================================
# PRODUCTION ENVIRONMENT
# =============================================================================
# Uncomment and fill in after creating resources in the Cloudflare dashboard.
# Deploy with: wrangler deploy --env production
# =============================================================================
[env.production]
vars = { ENV = "production" }
logpush = true

# [[env.production.r2_buckets]]
# binding = "MOVERS_BUCKET"
# bucket_name = "movers-storage"   #Your R2 bucket name

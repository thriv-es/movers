# =============================================================================
# Wrangler configuration for the client Cloudflare Pages app
#
# GETTING STARTED
# ---------------
# 1. Set `name` below to match your project name in Cloudflare Pages.
# 2. Build locally: pnpm build
# 3. Deploy to Cloudflare Pages: pnpm ship
#    (or: wrangler pages deploy dist --project-name=<your-project-name>)
# =============================================================================

name = "my-app-client"      # ← Rename to match your Cloudflare Pages project name
compatibility_date = "2025-05-01"
pages_build_output_dir = "dist"

[placement]
mode = "smart"

[vars]
ENV = "development"

# --- Production environment ---
[env.production]
vars = { ENV = "production" }
logpush = true


# Cloudflare Pages project configuration
# Matches Git-connected project: movers-front
name = "movers-front"
compatibility_date = "2023-12-18"
pages_build_output_dir = "dist"

[vars]
ENV = "production"

# NOTE: Service bindings must be configured in Cloudflare Dashboard for Git deployments
# Go to: movers-front → Settings → Functions → Service bindings
# Add: BACKEND → movers
#
# Alternatively, set BACKEND_URL secret in Dashboard:
# movers-front → Settings → Environment variables → Add: BACKEND_URL = https://movers.<account>.workers.dev

[placement]
mode = "smart"

[env.preview]
compatibility_date = "2023-12-18"
[env.preview.vars]
ENV = "preview"

[env.production]
vars = { ENV = "production" }

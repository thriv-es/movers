packages:
  # include the following directories in the workspace
  - 'apps/**/*'
  - 'packages/**/*'

  # explicitly exclude certain directories from the workspace
  - '!notes/**/*'
  - '!wip/**/*'
  - '!**/docs/**'
  - '!**/scripts/**'
  - '!**/workflow/**'

# Allow these packages to run install/build scripts (required for native binaries).
# pnpm 11+ requires explicit approval; run `pnpm approve-builds` to update interactively.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  sharp: true
  workerd: true

<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- Primary favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/og-image.png" />

    <!--
      ★ Static fallback meta tags ★
      These are the base defaults. react-helmet-async will override them
      at runtime with dynamic per-page values. Search engines that don't
      execute JS will still pick up these static defaults.
    -->
    <title>thriv.es movers — AI-Powered Moving Estimates in Minutes</title>
    <meta name="description"
      content="Get AI-powered moving estimates in minutes. Snap a few photos of your belongings and receive an instant, transparent, itemized price breakdown — no in-person visit needed." />
    <meta name="author" content="thriv.es" />
    <meta name="keywords" content="moving estimate,AI mover,relocation cost,moving quote,moving calculator,itemized estimate,online moving quote" />
    <meta name="robots" content="index,follow" />

    <!-- OpenGraph static defaults -->
    <meta property="og:title" content="thriv.es movers — AI-Powered Moving Estimates in Minutes" />
    <meta property="og:description"
      content="Get AI-powered moving estimates in minutes. Snap a few photos of your belongings and receive an instant, transparent, itemized price breakdown — no in-person visit needed." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en" />
    <meta property="og:site_name" content="thriv.es movers" />
    <meta property="og:image" content="https://movers.thriv.es/og-image.png" />
    <meta property="og:image:alt" content="thriv.es movers — AI-powered moving estimates. Your move, priced in minutes." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://movers.thriv.es" />

    <!-- Twitter Card static defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="thriv.es movers — AI-Powered Moving Estimates in Minutes" />
    <meta name="twitter:description"
      content="Get AI-powered moving estimates in minutes. Snap a few photos of your belongings and receive an instant, transparent, itemized price breakdown — no in-person visit needed." />
    <meta name="twitter:image" content="https://movers.thriv.es/og-image.png" />
    <meta name="twitter:image:alt" content="thriv.es movers — AI-powered moving estimates. Your move, priced in minutes." />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="thriv.es movers" />

    <!-- AEO — tags for LLMs and AI search agents -->
    <meta name="ai-content-type" content="website" />
    <meta name="ai-topic" content="moving services, relocation, moving estimates, AI moving quotes" />
    <meta name="ai-summary"
      content="Get AI-powered moving estimates in minutes. Snap a few photos and receive an instant itemized price breakdown — no in-person visit needed." />

    <!-- JSON-LD: Organization structured data for AI agents + search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "thriv.es movers",
      "url": "https://movers.thriv.es",
      "description": "Get AI-powered moving estimates in minutes. Snap a few photos of your belongings and receive an instant, transparent, itemized price breakdown — no in-person visit needed.",
      "logo": "https://movers.thriv.es/og-image.png",
      "sameAs": [
        "https://github.com/thriv-es/movers"
      ]
    }
    </script>

    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "thriv.es movers",
      "url": "https://movers.thriv.es",
      "description": "Get AI-powered moving estimates in minutes. Snap a few photos and receive an instant itemized price.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400;1,8..60,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <div id="root" class="grid min-h-svh grid-rows-[auto_1fr_auto]"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

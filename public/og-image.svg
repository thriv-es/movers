<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Icon area - favicon truck moved up and scaled -->
  <g transform="translate(80, 220) scale(16)" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" />
    <path d="M15 18H9" />
    <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" />
    <circle cx="17" cy="18" r="2" />
    <circle cx="7" cy="18" r="2" />
  </g>

  <!-- Main text -->
  <text x="500" y="200" font-family="'Georgia', 'Times New Roman', serif" font-size="88" font-style="italic" fill="#f8fafc" font-weight="400">
    thriv<tspan fill="#22c55e">.</tspan>es
  </text>
  <text x="500" y="260" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="36" fill="#94a3b8" font-weight="400" letter-spacing="4">
    MOVERS
  </text>

  <!-- Tagline -->
  <text x="500" y="350" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="28" fill="#cbd5e1" font-weight="300">
    Your move, priced in minutes.
  </text>

  <!-- Subtitle -->
  <text x="500" y="420" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="18" fill="#64748b" font-weight="400">
    AI-powered moving estimates. Snap photos — get an instant itemized price.
  </text>

  <!-- Accent bar -->
  <rect x="500" y="460" width="120" height="4" rx="2" fill="url(#accent)" />

  <!-- URL -->
  <text x="500" y="520" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" fill="#475569" font-weight="400" letter-spacing="2">
    movers.thriv.es
  </text>
</svg>